<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Innercompass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login-shell">
    <main class="admin-login-card">
        <p class="section-kicker">Employee Dashboard</p>
        <h1>Đăng nhập quản trị</h1>
        <p class="login-note">Nhập mã truy cập nội bộ để mở dashboard.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-stack">
            {% for category, message in messages %}
            <div class="flash-item flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="post" class="stack-form admin-login-form">
            <label for="access_code">Mã truy cập</label>
            <input id="access_code" name="access_code" type="password" placeholder="Nhập mã truy cập" required>
            <button type="submit" class="btn-primary">Vào dashboard</button>
        </form>

        <p class="login-hint">Mặc định dev: <strong>admin123</strong></p>
    </main>
</body>
</html>
